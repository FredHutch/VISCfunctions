      - create_step_curve
      - mb_results
      - trapz_sorted

  - title: "Output Formatting for PDF and Word"
    contents:
      - paste_tbl_grp
      - pretty_pvalues
      - stat_paste
      - escape
      - collapse_group_row
      - round_away_0

  - title: "Utility Functions"
    contents:
